[build-system]
requires = ["setuptools>=77"]  # SPDX `license = "MIT"` needs >=77
build-backend = "setuptools.build_meta"

[project]
name = "dark-rpg"
version = "1.0.0"
description = "A terminal dungeon-crawl text RPG: two swappable combat systems, rarity-based gear, status effects, special-ability enemies, and plugin-based room events. Pure Python, stdlib only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "rpg",
    "terminal",
    "text-adventure",
    "dungeon-crawler",
    "ascii-art",
    "turn-based-combat",
    "game",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

[project.scripts]
dark-rpg = "dark_rpg.cli:main"

[project.urls]
Homepage = "https://github.com/khaledadrani/dark_rpg"
Repository = "https://github.com/khaledadrani/dark_rpg"
Issues = "https://github.com/khaledadrani/dark_rpg/issues"

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "coverage"]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the default tuning file with the package so an installed `dark-rpg`
# works from any directory without a config.json next to the entry point.
[tool.setuptools.package-data]
dark_rpg = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["legacy", "build", "logs"]

[tool.ruff.lint]
# E/F only (same baseline as agentnet): real bugs, not style churn. Tighten
# incrementally (import sorting, pyupgrade) in dedicated commits.
select = ["E", "F"]
ignore = ["E501"]  # long explanatory comments are the house style

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/dark_rpg"]

[tool.coverage.run]
branch = true
source = ["dark_rpg"]
omit = ["*/tests/*"]

[tool.coverage.report]
# Whole-codebase floor 70%; changed code needs >= 80% lines AND branches via
# scripts/diff_coverage.py (`make coverage-gate`).
fail_under = 70
skip_empty = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
