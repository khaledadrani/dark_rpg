name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: ruff check
        run: uv run ruff check src tests scripts
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diff coverage gate needs the base branch history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest build coverage
      - name: Run tests (line + branch coverage)
        run: coverage run -m pytest -q
      - name: Whole-codebase coverage floor (70%)
        run: coverage report --skip-covered
      - name: Diff coverage gate (changed code >= 80% lines and branches)
        if: ${{ github.event_name == 'pull_request' && matrix.python-version == '3.12' }}
        run: |
          coverage json -q -o coverage.json
          python scripts/diff_coverage.py --base origin/${{ github.base_ref }} --min-lines 80 --min-branches 80
      - name: Balance simulation smoke check (both modes)
        run: python scripts/simulate.py --runs 50 --policy smart --all-modes
      - name: Build wheel (verifies packaging + config.json is shipped)
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python -m build --wheel
          python -m zipfile -l dist/dark_rpg-*-py3-none-any.whl | grep "dark_rpg/config.json" \
            || (echo "ERROR: config.json missing from wheel" && exit 1)
