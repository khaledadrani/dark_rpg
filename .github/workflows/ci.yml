name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --dev
      - name: ruff check
        run: uv run ruff check src tests scripts
      - name: mypy
        run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest build
      - name: Run tests
        run: python -m pytest -q
      - name: Balance simulation smoke check (both modes)
        run: python scripts/simulate.py --runs 50 --policy smart --all-modes
      - name: Build wheel (verifies packaging + config.json is shipped)
        if: ${{ matrix.python-version == '3.12' }}
        run: |
          python -m build --wheel
          python -m zipfile -l dist/dark_rpg-*-py3-none-any.whl | grep "dark_rpg/config.json" \
            || (echo "ERROR: config.json missing from wheel" && exit 1)
